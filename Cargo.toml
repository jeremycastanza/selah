[package]
name = "selah"
version = "0.4.0"
edition = "2024"
description = "A terminal Bible reader"
license = "GPL-3.0-only"
repository = "https://github.com/jeremycastanza/selah"

[[bin]]
name = "selah"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
rand = "0.9"
unicode-width = "0.2"
ureq = { version = "3", optional = true, features = ["json"] }

[features]
default = ["api"]
api = ["ureq"]
extra-translations = []

[profile.release]
opt-level = "z"
lto = true
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
